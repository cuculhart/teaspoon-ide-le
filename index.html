<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy.
      NOTE: 'unsafe-inline' (script/style) and ws://localhost:* are needed for
      the Vite dev server (react-refresh preamble, HMR websocket).
      Local Edition: connect-src is restricted to localhost - the only
      network destination the app ever uses is the local Ollama server
      (http://localhost:11434). cdn.jsdelivr.net entries are retained from
      upstream for Monaco compatibility but nothing fetches them at
      runtime in the packaged build.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Teaspoon IDE Local Edition</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
